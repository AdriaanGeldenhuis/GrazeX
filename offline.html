<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050606">
<title>You're offline — GrazeX</title>
<style>
  html, body { margin: 0; height: 100%; background: #050606; color: #f4f4ef; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  main { min-height: 100%; display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left)); box-sizing: border-box; }
  .card { max-width: 420px; text-align: center; border: 1px solid rgba(255, 255, 255, .12); border-radius: 22px; padding: 28px 22px; background: #0d100e; }
  h1 { font-size: 26px; margin: 0 0 10px; }
  p { color: #b9c0ba; line-height: 1.55; margin: 0 0 22px; }
  a { display: inline-block; padding: 14px 22px; border-radius: 14px; background: #ff7a00; color: #141414; font-weight: 800; text-decoration: none; }
  a:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>You're offline</h1>
    <p>There is no internet connection right now. Your cart is saved — try again when you have signal.</p>
    <a href="/">Try again</a>
  </div>
</main>
</body>
</html>
